<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Consulta de resultados · Simulado SARESP 2026</title>
<script src="supabase.min.js"></script>
<style>
:root{--azul:#0b5cab;--azul-esc:#08417a;--azul-cl:#e8f1fb;--txt:#1b2733;--mut:#5d6b7a;--bor:#d5dde6;--ok:#1f8a4c;--bad:#c0392b;--warn:#b26a00;--bg:#f3f6fa}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);background:var(--bg);line-height:1.45}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--bor);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.25rem;margin:0;color:var(--azul-esc)} h2{font-size:1.05rem;margin:0 0 10px}
.muted{color:var(--mut)} .small{font-size:.85rem}
select{font:inherit;padding:10px 12px;border:1.5px solid var(--bor);border-radius:10px;background:#fff;max-width:100%}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:10px 0}
.tabs{display:flex;gap:6px;margin:12px 0}
.tab{font:inherit;cursor:pointer;background:#fff;border:1.5px solid var(--bor);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--mut)}
.tab.on{background:var(--azul);border-color:var(--azul);color:#fff}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--bor);padding:8px 10px;text-align:left;white-space:nowrap}
th{background:var(--azul-cl)} td.n,th.n{text-align:right}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--azul-cl);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:1.5rem;color:var(--azul-esc)}
.bar{height:10px;background:#e6ebf1;border-radius:6px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%}
.msg{border-radius:10px;padding:10px 12px;background:var(--azul-cl);color:var(--azul-esc);margin-bottom:12px}
.err{background:#fdecea;color:#8a1c14}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.ch{border:1px solid var(--bor);border-radius:12px;padding:14px}
.hb{display:grid;grid-template-columns:130px 1fr 92px;gap:8px;align-items:center;margin:7px 0;font-size:.9rem}
.hb .t{height:16px;background:#e6ebf1;border-radius:6px;overflow:hidden}.hb .t i{display:block;height:100%;border-radius:6px}
.hb .v{text-align:right;font-variant-numeric:tabular-nums}
.cl{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;margin-bottom:6px}.cl span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}
.cell{border-radius:8px;padding:3px 8px;font-weight:700;display:inline-block;min-width:58px;text-align:center}

.qmo{position:fixed;inset:0;background:rgba(10,20,35,.62);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:18px 10px}
.qbox{background:#fff;border-radius:14px;max-width:880px;width:100%;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.qbox img{max-width:100%;height:auto;display:block;margin:10px auto;border:1px solid var(--bor);border-radius:8px}
.qhd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.qx{font:inherit;cursor:pointer;border:1.5px solid var(--bor);background:#fff;border-radius:10px;padding:6px 12px;font-weight:700}
a.qv{color:var(--azul);font-weight:800;text-decoration:underline dotted;cursor:pointer}
.qopt{margin:6px 0;padding:8px 10px;border:1px solid var(--bor);border-radius:8px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card">Carregando…</div></div>
<script>
const SB_URL = 'https://pkhxjvynplncvdpxutjn.supabase.co';
const SB_KEY = 'sb_publishable_3TPRYBnHfrGy4k5xbD1Xkw_6KfvHt4z';
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession:false, autoRefreshToken:false } });
const app = document.getElementById('app');
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const TOKEN = new URLSearchParams(location.search).get('chave') || '';
const lbl = e => e.grade+'º ano · '+e.day+'º dia';
const D = { school:'', exams:[], rows:[], tab:'res', ex:'' };
const exById = id => D.exams.find(e=>e.id===id);
const fdate = d => d ? new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : '—';

async function load(){
  const { data, error } = await sb.rpc('view_results', { p_token: TOKEN });
  if(error || !data){
    app.innerHTML = `<div class="card"><h1>Link inválido ou desativado</h1><p class="muted">Peça à coordenação da escola um link novo de consulta.</p></div>`; return;
  }
  D.school = data.school; D.exams = data.exams; D.rows = data.rows; D.sub = null; D.ex = (D.exams[0]||{}).id || '';
  render();
}
function render(){
  app.innerHTML = `<div class="card"><h1>Resultados do simulado</h1><div class="muted small">${esc(D.school)} · Simulado SARESP 2026 · somente consulta</div>
    <div class="tabs"><button class="tab ${D.tab==='res'?'on':''}" data-t="res">Resultados</button><button class="tab ${D.tab==='qst'?'on':''}" data-t="qst">Por questão</button><button class="tab ${D.tab==='dis'?'on':''}" data-t="dis">Por disciplina</button>
    <button class="tab" id="rf">↻ Atualizar</button></div><div id="pane"></div></div>`;
  document.querySelectorAll('.tab[data-t]').forEach(b=> b.onclick = ()=>{ D.tab=b.dataset.t; render(); });
  document.getElementById('rf').onclick = load;
  (D.tab==='res'?paneRes:D.tab==='dis'?paneDis:paneQst)();
}
function paneRes(){
  const pane = document.getElementById('pane');
  pane.innerHTML = `<div class="row">
    <label>Prova: <select id="fe"><option value="">Todas as provas</option>${D.exams.map(e=>`<option value="${e.id}">${lbl(e)}</option>`).join('')}</select></label>
    <label>Turma: <select id="ft"></select></label></div>
    <div id="kp"></div><h2 style="margin-top:14px">Resumo por turma</h2><div class="tw" id="rt"></div>
    <h2 style="margin-top:14px">Alunos</h2><div class="tw" id="tb"></div>`;
  const fe = document.getElementById('fe'), ft = document.getElementById('ft');
  const base = ()=> D.rows.filter(r=>!fe.value || r.exam_id===fe.value);
  const fill = ()=>{ const c = ft.value, t = [...new Set(base().map(r=>r.class))].sort(); ft.innerHTML = '<option value="">Todas</option>'+t.map(x=>`<option ${x===c?'selected':''}>${esc(x)}</option>`).join(''); };
  const now = ()=> base().filter(r=>!ft.value || r.class===ft.value);
  const draw = ()=>{
    const rows = now(), done = rows.filter(r=>r.finished && r.score!=null);
    const avg = done.length ? done.reduce((a,r)=>a+r.score,0)/done.length : null;
    document.getElementById('kp').innerHTML = `<div class="kpis">
      <div class="kpi"><b>${rows.length}</b>iniciaram</div><div class="kpi"><b>${rows.filter(r=>r.finished).length}</b>finalizaram</div>
      <div class="kpi"><b>${avg==null?'—':avg.toFixed(1)}</b>média de acertos</div><div class="kpi"><b>${done.length?Math.max(...done.map(r=>r.score)):'—'}</b>maior nota</div></div>`;
    const by = {};
    rows.forEach(r=>{ const k = r.exam_id+'|'+r.class; const o = by[k] ||= { ex:r.exam_id, t:r.class, n:0, f:0, sum:0, tot:0 }; o.n++; if(r.finished){ o.f++; if(r.score!=null){ o.sum+=r.score; o.tot++; } } });
    document.getElementById('rt').innerHTML = `<table><tr><th>Prova</th><th>Turma</th><th class="n">Iniciaram</th><th class="n">Finalizaram</th><th class="n">Média de acertos</th><th class="n">% médio</th></tr>
      ${Object.values(by).sort((a,b)=>D.exams.findIndex(e=>e.id===a.ex)-D.exams.findIndex(e=>e.id===b.ex)||a.t.localeCompare(b.t)).map(o=>{ const e=exById(o.ex), m=o.tot?o.sum/o.tot:null;
        return `<tr><td>${esc(lbl(e))}</td><td>${esc(o.t)}</td><td class="n">${o.n}</td><td class="n">${o.f}</td><td class="n">${m==null?'—':m.toFixed(1)+'/'+e.total}</td><td class="n">${m==null?'—':Math.round(m/e.total*100)+'%'}</td></tr>`; }).join('') || '<tr><td colspan="6" class="muted">Nenhum aluno ainda.</td></tr>'}</table>`;
    document.getElementById('tb').innerHTML = `<table><tr><th>Aluno</th><th>Turma</th><th>Prova</th><th class="n">Acertos</th><th class="n">%</th><th>Início</th><th>Situação</th></tr>
      ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.class)}</td><td>${esc(lbl(exById(r.exam_id)))}</td><td class="n">${r.score==null?'—':r.score+'/'+r.total}</td>
        <td class="n">${r.score==null||!r.total?'—':Math.round(r.score/r.total*100)+'%'}</td><td>${fdate(r.started)}</td><td>${r.finished?'✓ finalizou':'<span style="color:var(--warn)">em andamento</span>'}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">Nenhum aluno ainda.</td></tr>'}</table>`;
  };
  fe.onchange = ()=>{ ft.value=''; fill(); draw(); }; ft.onchange = draw; fill(); draw();
}

const SUBC = {'Língua Portuguesa':'#0b5cab','Matemática':'#8e44ad','Ciências':'#1f8a4c','Língua Inglesa':'#d35400','Geografia':'#b8860b','História':'#c0392b'};
const subCol = n => SUBC[n] || '#5d6b7a';
const pcol = p => p>=70?'var(--ok)':p>=40?'#e6a100':'var(--bad)';

let REC_N = 0;
async function recBlock(exId, cls, sid){
  const el = document.getElementById('rec'); if(!el) return;
  const my = ++REC_N; el.innerHTML = '<p class="muted small">Calculando recomposição…</p>';
  const { data, error } = await sb.rpc('view_question_stats', { p_token:TOKEN, p_exam:exId, p_class:cls||null });
  if(my!==REC_N) return;
  if(error || !data){ el.innerHTML=''; return; }
  const items = data.map(r=>({ n:r.o_q, subj:r.o_subject, st:'', p:r.o_pct, base:r.o_students }));
  const noKey = false;
  if(noKey){ el.innerHTML = '<div class="msg info">Cadastre o gabarito desta prova para ver as questões de recomposição.</div>'; return; }
  const subs = [...new Set(items.map(i=>i.subj))];
  const base = items.length ? items[0].base : 0;
  el.innerHTML = `<h2 style="margin-top:18px">Recomposição de aprendizagem</h2>
    <p class="muted small" style="margin-top:-4px">Questões que a maioria dos alunos errou, para o professor de cada disciplina retomar em sala. <b>Retomar</b>: menos de 40% de acerto. <b>Atenção</b>: de 40% a 59%. Base: ${base} aluno(s).</p>
    <div class="g2">${subs.map(sj=>{
      const l = items.filter(i=>i.subj===sj).sort((a,b)=>a.p-b.p||a.n-b.n);
      const low = l.filter(i=>i.p<40), mid = l.filter(i=>i.p>=40&&i.p<60);
      return `<div class="ch" style="border-top:4px solid ${subCol(sj)}"><h2>${esc(sj)}</h2>
        ${low.length?`<div style="color:var(--bad);font-weight:700;margin:6px 0">Retomar (${low.length} de ${l.length} questões)</div>${low.map(it=>`<div style="margin:6px 0">${qlink(exId,it.n,'<b>Questão '+it.n+'</b>')} · <span style="color:var(--bad);font-weight:700">${it.p}% de acerto</span></div>`).join('')}`:'<div style="color:var(--ok);font-weight:700;margin:6px 0">Nenhuma questão abaixo de 40% ✓</div>'}
        ${mid.length?`<div style="color:#9a6b00;font-weight:700;margin:10px 0 4px">Atenção</div><div>${mid.map(it=>`${qlink(exId,it.n,'<span class="cell" style="background:#fdf0cf;margin:2px 4px 2px 0">Q'+it.n+' · '+it.p+'%</span>')}`).join('')}</div>`:''}
      </div>`; }).join('')}</div>`;
}
async function paneDis(){
  const pane = document.getElementById('pane');
  if(!D.sub){
    pane.innerHTML = '<div class="msg">Carregando…</div>';
    const { data, error } = await sb.rpc('view_subject_stats', { p_token:TOKEN });
    if(error || !data){ pane.innerHTML = '<div class="msg err">Não foi possível carregar os dados por disciplina.</div>'; return; }
    D.sub = data;
  }
  const exs = D.exams.filter(e=>D.sub.some(r=>r.exam_id===e.id));
  if(!exs.length){ pane.innerHTML = '<div class="msg">Ainda não há alunos que finalizaram a prova.</div>'; return; }
  if(!exs.some(e=>e.id===D.dex)) D.dex = exs[0].id;
  pane.innerHTML = `<div class="row"><label>Prova: <select id="fe">${exs.map(e=>`<option value="${e.id}" ${e.id===D.dex?'selected':''}>${lbl(e)}</option>`).join('')}</select></label>
    <label>Turma: <select id="ft"></select></label><label>Aluno: <select id="fa"></select></label></div><div id="out"></div>`;
  const fe = document.getElementById('fe'), ft = document.getElementById('ft'), fa = document.getElementById('fa');
  const ofExam = ()=> D.sub.filter(r=>r.exam_id===fe.value);
  const fillT = ()=>{ D.dex = fe.value; const t=[...new Set(ofExam().map(r=>r.class))].sort(); ft.innerHTML='<option value="">Todas</option>'+t.map(x=>`<option>${esc(x)}</option>`).join(''); fillA(); };
  const fillA = ()=>{ const l=ofExam().filter(r=>!ft.value||r.class===ft.value); fa.innerHTML='<option value="">Todos (visão geral)</option>'+l.map((r,i)=>`<option value="${esc(r.class+'|'+r.name+'|'+i)}">${esc(r.name)} · ${esc(r.class)}</option>`).join(''); fa._l=l; draw(); };
  const draw = ()=>{
    const l = fa._l, ai = fa.value ? +fa.value.split('|').pop() : -1, one = ai>=0 ? l[ai] : null;
    const set = one ? [one] : l;
    const subs = Object.keys((l[0]||{}).subjects||{});
    const agg = (rows,sj)=>{ let ok=0,t=0; rows.forEach(r=>{ const v=r.subjects[sj]; if(v){ ok+=v[0]; t+=v[1]; } }); return { ok, t, p: t?Math.round(ok/t*100):0 }; };
    let h = '';
    if(one){
      h += `<div class="kpis"><div class="kpi"><b>${esc(one.name)}</b>${esc(one.class)}</div>${subs.map(sj=>{ const v=one.subjects[sj]; return `<div class="kpi"><b>${v[0]}/${v[1]}</b>${esc(sj)}</div>`; }).join('')}</div>`;
    } else {
      h += `<div class="kpis"><div class="kpi"><b>${set.length}</b>alunos considerados</div>${subs.map(sj=>`<div class="kpi"><b>${agg(set,sj).p}%</b>${esc(sj)}</div>`).join('')}</div>`;
    }
    h += '<div class="g2">';
    h += `<div class="ch"><h2>${one?'Acertos de '+esc(one.name)+' por disciplina':'Aproveitamento por disciplina'}</h2>${subs.map(sj=>{ const a=agg(set,sj); return `<div class="hb"><span>${esc(sj)}</span><div class="t"><i style="width:${a.p}%;background:${subCol(sj)}"></i></div><span class="v">${one?a.ok+' de '+a.t:a.p+'%'}</span></div>`; }).join('')}
      <p class="muted small">${one?'Quantidade de questões certas em cada disciplina.':'Porcentagem de acertos de todos os alunos selecionados (cada aluno conta uma vez, pela maior nota).'}</p></div>`;
    if(!one){
      h += `<div class="ch"><h2>Média de acertos por aluno</h2>${subs.map(sj=>{ const a=agg(set,sj), mo=set.length?a.ok/set.length:0, mt=set.length?a.t/set.length:0; return `<div class="hb"><span>${esc(sj)}</span><div class="t"><i style="width:${a.p}%;background:${subCol(sj)}"></i></div><span class="v">${mo.toFixed(1)} de ${mt}</span></div>`; }).join('')}
        <p class="muted small">Em média, quantas questões cada aluno acertou em cada disciplina.</p></div>`;
      const turmas = [...new Set(l.map(r=>r.class))].sort();
      if(turmas.length>1){
        h += `<div class="ch" style="grid-column:1/-1"><h2>Comparação entre turmas</h2><div class="cl">${subs.map(sj=>`<span style="--c:${subCol(sj)}">${esc(sj)}</span>`).join('')}</div>
          ${turmas.map(t=>{ const rs=l.filter(r=>r.class===t); return `<div style="margin:10px 0"><b>${esc(t)}</b> <span class="muted small">(${rs.length} aluno${rs.length>1?'s':''})</span>${subs.map(sj=>{ const a=agg(rs,sj); return `<div class="hb" style="grid-template-columns:96px 1fr 48px"><span class="muted small">${esc(sj.replace('Língua ','L. '))}</span><div class="t"><i style="width:${a.p}%;background:${subCol(sj)}"></i></div><span class="v">${a.p}%</span></div>`; }).join('')}</div>`; }).join('')}</div>`;
      }
      // distribuição de acertos em cada disciplina (faixas)
      h += `<div class="ch" style="grid-column:1/-1"><h2>Quantos alunos em cada faixa de acerto</h2>${subs.map(sj=>{ const b=[0,0,0]; set.forEach(r=>{ const v=r.subjects[sj]; const p=v[1]?v[0]/v[1]*100:0; b[p>=70?2:p>=40?1:0]++; }); const n=set.length||1;
        return `<div style="margin:10px 0"><b>${esc(sj)}</b><div style="display:flex;height:22px;border-radius:7px;overflow:hidden;margin-top:4px;font-size:.78rem;color:#fff;font-weight:700">
          <div style="width:${b[0]/n*100}%;background:var(--bad);text-align:center">${b[0]||''}</div><div style="width:${b[1]/n*100}%;background:#e6a100;text-align:center">${b[1]||''}</div><div style="width:${b[2]/n*100}%;background:var(--ok);text-align:center">${b[2]||''}</div></div></div>`; }).join('')}
        <div class="cl"><span style="--c:var(--bad)">menos de 40%</span><span style="--c:#e6a100">40% a 69%</span><span style="--c:var(--ok)">70% ou mais</span></div></div>`;
    }
    h += '</div>';
    h += one ? '' : '<div id="rec"></div>';
    h += `<h2 style="margin-top:16px">Acertos por aluno</h2><div class="tw"><table><tr><th>Aluno</th><th>Turma</th>${subs.map(sj=>`<th class="n">${esc(sj)}</th>`).join('')}<th class="n">Total</th></tr>
      ${set.map(r=>{ let ok=0,t=0; const cells=subs.map(sj=>{ const v=r.subjects[sj]||[0,0]; ok+=v[0]; t+=v[1]; const p=v[1]?Math.round(v[0]/v[1]*100):0; const bg=p>=70?'#dff3e7':p>=40?'#fdf0cf':'#fbe0dc'; return `<td class="n"><span class="cell" style="background:${bg}">${v[0]}/${v[1]}</span></td>`; }).join('');
        return `<tr><td>${esc(r.name)}</td><td>${esc(r.class)}</td>${cells}<td class="n"><b>${ok}/${t}</b></td></tr>`; }).join('')}</table></div>
      <p class="muted small">Considera só a prova finalizada com a maior nota de cada aluno. Questão em branco conta como erro.</p>`;
    document.getElementById('out').innerHTML = h;
    if(!one) recBlock(fe.value, ft.value, null);
  };
  fe.onchange = fillT; ft.onchange = fillA; fa.onchange = draw; fillT();
}

/* ---------- ver a questão ---------- */
window.QIMG = window.QIMG || {};
const QC = {};
async function qLoad(exId){
  if(!QC[exId]){
    const { data } = await sb.from('questions').select('number,subject,support_text,image_url,full_image,statement,options').eq('exam_id', exId);
    QC[exId] = Object.fromEntries((data||[]).map(q=>[q.number,q]));
  }
  if(Object.values(QC[exId]).some(q=>q.full_image) && !window.QIMG[exId]){
    await new Promise(r=>{ const s=document.createElement('script'); s.src='q-'+exId+'.js'; s.onload=()=>r(); s.onerror=()=>r(); document.head.appendChild(s); });
  }
}
const nl = t => esc(t||'').replace(/\n/g,'<br>');
async function showQ(exId, n){
  const mo = document.createElement('div'); mo.className='qmo';
  mo.innerHTML = '<div class="qbox"><p>Carregando a questão…</p></div>'; document.body.appendChild(mo);
  const close = ()=>{ mo.remove(); document.removeEventListener('keydown', onk); };
  const onk = ev=>{ if(ev.key==='Escape') close(); };
  mo.onclick = ev=>{ if(ev.target===mo) close(); }; document.addEventListener('keydown', onk);
  try{ await qLoad(exId); }catch(e){}
  const q = (QC[exId]||{})[n], ex = exById(exId);
  let body;
  if(!q) body = '<p class="muted">Não foi possível carregar esta questão.</p>';
  else {
    const src = (window.QIMG[exId]||{})[n] || q.image_url;
    if(q.full_image){
      body = src ? `<img src="${esc(src)}" alt="Questão ${n}">` : '<p class="muted">Imagem da questão indisponível (o arquivo q-'+esc(exId)+'.js precisa estar no site).</p>';
    } else {
      body = `${q.support_text?`<div class="msg">${nl(q.support_text)}</div>`:''}${q.image_url?`<img src="${esc(q.image_url)}" alt="Figura da questão ${n}">`:''}
        <div style="margin:10px 0">${nl(q.statement)}</div>${['A','B','C','D'].map(L=>`<div class="qopt"><b>${L})</b> ${nl((q.options||{})[L])}</div>`).join('')}`;
    }
  }
  const g = typeof D!=='undefined' && D.key && D.key[exId] ? D.key[exId][n] : null;
  mo.innerHTML = `<div class="qbox"><div class="qhd"><div><h2 style="margin:0">Questão ${n}${q?' · '+esc(q.subject):''}</h2><div class="muted small">${ex?esc(lbl(ex)):''}${g?' · <b>Gabarito: '+esc(g)+'</b>':''}</div></div><button class="qx">Fechar ✕</button></div>${body}</div>`;
  mo.querySelector('.qx').onclick = close;
}
document.addEventListener('click', ev=>{ const a = ev.target.closest('[data-qv]'); if(a){ ev.preventDefault(); const [e,n] = a.dataset.qv.split('|'); showQ(e, +n); } });
const qlink = (exId, n, txt) => `<a href="#" class="qv" data-qv="${esc(exId)}|${n}" title="Ver a questão">${txt}</a>`;
async function paneQst(){
  const pane = document.getElementById('pane');
  pane.innerHTML = `<div class="row"><label>Prova: <select id="fe">${D.exams.map(e=>`<option value="${e.id}" ${e.id===D.ex?'selected':''}>${lbl(e)}</option>`).join('')}</select></label>
    <label>Turma: <select id="ft"></select></label></div><div id="bl"></div><div class="tw" id="tb">Carregando…</div>`;
  const fe = document.getElementById('fe'), ft = document.getElementById('ft');
  const fill = ()=>{ const t = [...new Set(D.rows.filter(r=>r.exam_id===fe.value).map(r=>r.class))].sort(); ft.innerHTML = '<option value="">Todas</option>'+t.map(x=>`<option>${esc(x)}</option>`).join(''); };
  const draw = async ()=>{
    D.ex = fe.value;
    const { data, error } = await sb.rpc('view_question_stats', { p_token:TOKEN, p_exam:fe.value, p_class:ft.value||null });
    if(error){ document.getElementById('tb').innerHTML = '<div class="msg err">Não foi possível carregar.</div>'; return; }
    const total = data.length ? data[0].o_students : 0;
    const subj = {}; data.forEach(r=>{ (subj[r.o_subject] ||= []).push(r.o_pct); });
    document.getElementById('bl').innerHTML = `<div class="kpis">${Object.entries(subj).map(([n,a])=>`<div class="kpi"><b>${total?Math.round(a.reduce((x,y)=>x+y,0)/a.length)+'%':'—'}</b>${esc(n)}</div>`).join('')}</div>
      <p class="muted small">Base: ${total} aluno(s) que finalizaram. Questão em branco conta como erro.</p>`;
    const color = p => p>=70?'var(--ok)':p>=40?'#e6a100':'var(--bad)';
    document.getElementById('tb').innerHTML = `<table><tr><th>Questão</th><th>Disciplina</th><th class="n">% de acerto</th><th></th></tr>
      ${data.map(r=>`<tr><td>${qlink(fe.value,r.o_q,'<b>'+r.o_q+'</b>')}</td><td>${esc(r.o_subject)}</td><td class="n">${r.o_pct}%</td><td><div class="bar"><i style="width:${r.o_pct}%;background:${color(r.o_pct)}"></i></div></td></tr>`).join('')}</table>`;
  };
  fe.onchange = ()=>{ fill(); draw(); }; ft.onchange = draw; fill(); draw();
}
load();
</script>
