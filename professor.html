<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel do Professor · Simulado SARESP 2026</title>
<script src="supabase.min.js"></script>
<style>
:root{--azul:#0b5cab;--azul-esc:#08417a;--azul-cl:#e8f1fb;--txt:#1b2733;--mut:#5d6b7a;--bor:#d5dde6;--ok:#1f8a4c;--bad:#c0392b;--warn:#b26a00;--bg:#f3f6fa}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--txt);background:var(--bg);line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--bor);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:1.3rem;margin:0;color:var(--azul-esc)} h2{font-size:1.05rem;margin:0 0 10px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--mut)} .small{font-size:.85rem}
input,select{font:inherit;padding:10px 12px;border:1.5px solid var(--bor);border-radius:10px;background:#fff}
input[type=email]{width:100%}
button{font:inherit;cursor:pointer}
.btn{background:var(--azul);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.sec{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}
.btn.red{background:var(--bad);color:#fff} .btn:disabled{opacity:.5}
.btn.xs{padding:5px 10px;font-size:.82rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:#fff;border:1.5px solid var(--bor);border-radius:999px;padding:8px 16px;font-weight:700;color:var(--mut)}
.tab.on{background:var(--azul);border-color:var(--azul);color:#fff}
.msg{border-radius:10px;padding:10px 12px;margin-top:10px}
.msg.ok{background:#e6f5ec;color:#14562f} .msg.err{background:#fdecea;color:#8a1c14} .msg.info{background:var(--azul-cl);color:var(--azul-esc)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:10px 0}
.sw{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1.5px solid var(--bor);border-radius:10px;cursor:pointer;user-select:none}
.sw input{width:18px;height:18px;padding:0}
.sw.on{border-color:var(--ok);background:#f0faf4}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--bor);padding:8px 10px;text-align:left;white-space:nowrap}
th{background:var(--azul-cl);position:sticky;top:0}
td.n,th.n{text-align:right}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--azul-cl);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:1.5rem;color:var(--azul-esc)}
.bar{height:10px;background:#e6ebf1;border-radius:6px;min-width:120px;overflow:hidden}
.bar i{display:block;height:100%}
.gk{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.gi{display:flex;align-items:center;gap:6px;border:1.5px solid var(--bor);border-radius:10px;padding:6px 10px;min-width:0}
.gi b{flex:0 0 28px}
.gi label{display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border-radius:8px;cursor:pointer;white-space:nowrap}
.gi label input{width:auto;padding:0}
textarea{width:100%;font:inherit;padding:10px;border:1.5px solid var(--bor);border-radius:10px;min-height:70px}
.lk{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.lk b{min-width:120px}
.lk input{flex:1;min-width:220px}
#lg,#pw{width:100%}
.lb{display:block;font-weight:600;margin:12px 0 6px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const SB_URL = 'https://pkhxjvynplncvdpxutjn.supabase.co';
const SB_KEY = 'sb_publishable_3TPRYBnHfrGy4k5xbD1Xkw_6KfvHt4z';
const sb = supabase.createClient(SB_URL, SB_KEY);
const app = document.getElementById('app');
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const D = { exams:[], ex:null, qs:[], key:{}, subs:[], schools:[], se:{}, admin:false, sch:null, fs:'', invite:'', tab:'sim' };
const lbl = e => e.grade+'º ano · '+e.day+'º dia';
const exById = id => D.exams.find(e=>e.id===id);
const fdate = d => d ? new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) : '—';

/* ---------- entrada ---------- */
const LOGIN_DOMAIN = 'painel.invalid';
const toEmail = l => { l = l.trim().toLowerCase(); return l.includes('@') ? l : l.replace(/\s+/g,'') + '@' + LOGIN_DOMAIN; };

function screenLogin(msg){
  app.innerHTML = `<div class="card" style="max-width:460px;margin:40px auto">
    <h1>Painel do Professor</h1>
    <p class="muted">Simulado SARESP 2026</p>
    <label class="lb" for="lg">Login</label>
    <input id="lg" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="login">
    <label class="lb" for="pw">Senha</label>
    <input type="password" id="pw" autocomplete="current-password" placeholder="senha">
    <p><button class="btn" id="ent" style="width:100%">Entrar</button></p>
    <div id="m">${msg||''}</div>
    <details style="margin-top:14px"><summary class="small" style="cursor:pointer;font-weight:700;color:var(--azul)">Cadastrar minha escola</summary>
      <p class="small muted">Para escolas com até 300 alunos. Você precisa do <b>código de cadastro</b> informado pelo administrador do simulado. O login e a senha que você criar aqui serão o acesso de todos os professores da escola.</p>
      <label class="lb" for="rn">Nome completo da escola</label><input id="rn" placeholder="Ex.: E.E. Professor Fulano de Tal" style="width:100%">
      <label class="lb" for="rq">Número aproximado de alunos (até 300)</label><input id="rq" type="number" min="1" max="300" style="width:100%">
      <label class="lb" for="rl">Login da escola (sem espaços)</label><input id="rl" autocapitalize="none" spellcheck="false" placeholder="ex.: escolafulano" style="width:100%">
      <label class="lb" for="rp">Senha (mínimo 8 caracteres)</label><input id="rp" type="password" autocomplete="new-password" style="width:100%">
      <label class="lb" for="rc">Código de cadastro</label><input id="rc" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX" style="width:100%">
      <p><button class="btn" id="rg" style="width:100%">Cadastrar escola e entrar</button></p><div id="m3"></div></details>
    <details style="margin-top:14px"><summary class="muted small" style="cursor:pointer">Prefiro entrar com link por e-mail</summary>
      <p class="small muted">Digite seu e-mail. Você receberá um link de acesso (sem senha).</p>
      <input type="email" id="em" placeholder="seu e-mail" autocomplete="email">
      <p><button class="btn sec" id="go" style="width:100%">Enviar link de acesso</button></p>
      <div id="m2"></div></details></div>`;
  const ent = document.getElementById('ent');
  const doLogin = async ()=>{
    const lg = document.getElementById('lg').value, pw = document.getElementById('pw').value, m = document.getElementById('m');
    if(!lg.trim() || !pw){ m.innerHTML = '<div class="msg err">Digite o login e a senha.</div>'; return; }
    ent.disabled = true; ent.textContent = 'Entrando…';
    const { error } = await sb.auth.signInWithPassword({ email: toEmail(lg), password: pw });
    ent.disabled = false; ent.textContent = 'Entrar';
    if(error){ m.innerHTML = '<div class="msg err">'+(/invalid|credentials/i.test(error.message)?'Login ou senha incorretos.':'Não foi possível entrar: '+esc(error.message))+'</div>'; return; }
    start();
  };
  ent.onclick = doLogin;
  document.getElementById('rg').onclick = async ()=>{
    const v = id => document.getElementById(id).value, m = document.getElementById('m3'), g = document.getElementById('rg');
    const login = v('rl').trim().toLowerCase(), password = v('rp');
    g.disabled = true; g.textContent = 'Cadastrando…'; m.innerHTML = '';
    try{
      const r = await fetch(SB_URL+'/functions/v1/school-admin', { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SB_KEY },
        body:JSON.stringify({ action:'register_school', name:v('rn'), expected_students:v('rq'), login, password, invite_code:v('rc') }) });
      const j = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(j.error||'Não foi possível cadastrar.');
      const { error } = await sb.auth.signInWithPassword({ email: toEmail(login), password });
      if(error) throw new Error('Escola cadastrada! Entre com o login e a senha que você criou.');
      start();
    }catch(e){ m.innerHTML = '<div class="msg err">'+esc(e.message)+'</div>'; }
    g.disabled = false; g.textContent = 'Cadastrar escola e entrar';
  };
  document.getElementById('pw').onkeydown = e=>{ if(e.key==='Enter') doLogin(); };
  document.getElementById('go').onclick = async ()=>{
    const email = document.getElementById('em').value.trim().toLowerCase();
    const m = document.getElementById('m2');
    if(!email){ m.innerHTML = '<div class="msg err">Digite o e-mail.</div>'; return; }
    const g = document.getElementById('go'); g.disabled = true; g.textContent = 'Enviando…';
    const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin + location.pathname } });
    g.disabled = false; g.textContent = 'Enviar link de acesso';
    m.innerHTML = error
      ? `<div class="msg err">Não foi possível enviar: ${esc(error.message)}</div>`
      : '<div class="msg ok">Link enviado! Abra o e-mail neste aparelho e toque no link. Confira também a caixa de spam.</div>';
  };
}

let starting = false;
async function start(){ if(starting) return; starting = true; try{ await startInner(); } finally{ starting = false; } }
async function startInner(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ screenLogin(); return; }
  const { data:isT, error } = await sb.rpc('is_teacher');
  if(error || !isT){
    app.innerHTML = `<div class="card" style="max-width:460px;margin:40px auto"><h1>Sem permissão</h1>
      <p>A conta <b>${esc(session.user.email)}</b> não tem acesso a este painel.</p>
      <button class="btn sec" id="so">Sair</button></div>`;
    document.getElementById('so').onclick = async ()=>{ await sb.auth.signOut(); location.href = location.pathname; };
    return;
  }
  try{ D.admin = !!(await sb.rpc('is_admin')).data; await loadAll(); render(); }
  catch(e){ app.innerHTML = `<div class="card"><div class="msg err">Erro ao carregar os dados: ${esc(e.message||e)}</div><p><button class="btn" onclick="location.reload()">Tentar de novo</button></p></div>`; }
}
sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_IN' && !D.exams.length) start(); });

async function fetchAll(make){
  let all = [], from = 0; const step = 1000;
  for(;;){
    const { data, error } = await make(from, from+step-1);
    if(error) throw error;
    all = all.concat(data); if(data.length < step) break; from += step;
  }
  return all;
}
async function loadAll(){
  const [e,k,q,u,sch,sx,cf] = await Promise.all([
    sb.from('exams').select('*').order('sort'),
    fetchAll((a,b)=>sb.from('answer_key').select('exam_id,number,correct').order('exam_id').order('number').range(a,b)),
    fetchAll((a,b)=>sb.from('questions').select('exam_id,number,block,subject').order('exam_id').order('number').range(a,b)),
    fetchAll((a,b)=>sb.from('submissions').select('*').order('started_at',{ascending:false}).order('id').range(a,b)),
    sb.from('schools').select('*').order('name'),
    fetchAll((a,b)=>sb.from('school_exams').select('*').order('school_id').order('exam_id').range(a,b)),
    D.admin ? sb.from('app_config').select('value').eq('key','invite_code').maybeSingle() : Promise.resolve({ data:null })
  ]);
  if(e.error) throw e.error; if(sch.error) throw sch.error;
  D.exams = e.data; D.qs = q; D.subs = u; D.schools = sch.data; D.invite = (cf.data && cf.data.value) || '';
  D.se = {}; sx.forEach(r=>{ (D.se[r.school_id] ||= {})[r.exam_id] = { is_open:r.is_open, show_score:r.show_score }; });
  if(!D.sch || !schoolOf(D.sch)) D.sch = (D.schools[0]||{}).id || null;
  D.key = {}; k.forEach(r=>{ (D.key[r.exam_id] ||= {})[r.number] = r.correct.trim(); });
  if(!D.ex || !exById(D.ex)){
    let s = null; try{ s = localStorage.getItem('prof_ex'); }catch(_){}
    D.ex = exById(s) ? s : D.exams[0].id;
  }
}

/* ---------- estrutura ---------- */
const schoolOf = id => D.schools.find(x=>x.id===id);
const schoolName = id => (schoolOf(id)||{}).name || '—';
const distinctStudents = sid => new Set(D.subs.filter(s=>s.school_id===sid).map(s=>(s.student_name+'|'+s.class_name).toLowerCase().replace(/\s+/g,' '))).size;
const baseUrl = () => location.origin + location.pathname.replace(/professor\.html$/,'');
const schoolSel = (id, val, withAll) => `<label><b>Escola:</b> <select id="${id}">${withAll?`<option value="">Todas as escolas</option>`:''}${D.schools.map(x=>`<option value="${x.id}" ${x.id===val?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`;

function render(){
  const tabs = [['sim','Provas'],['gab','Gabarito'],['res','Resultados'],['qst','Por questão'],['esc',D.admin?'Escolas':'Minha escola']];
  app.innerHTML = `
    <div class="head"><div><h1>Painel do Professor</h1><div class="muted small">${D.admin?'Administrador · todas as escolas':esc((D.schools[0]||{}).name||'')} · Simulado SARESP 2026</div></div>
      <div><button class="btn sec" id="rf">↻ Atualizar</button> <button class="btn sec" id="so">Sair</button></div></div>
    <div class="tabs">${tabs.map(([id,l])=>`<button class="tab ${D.tab===id?'on':''}" data-t="${id}">${l}</button>`).join('')}</div>
    ${(D.tab==='gab'||D.tab==='qst')?`<div class="row" style="margin-top:0"><label><b>Prova:</b> <select id="exsel">${D.exams.map(e=>`<option value="${e.id}" ${e.id===D.ex?'selected':''}>${lbl(e)}</option>`).join('')}</select></label></div>`:''}
    <div id="pane"></div>`;
  document.querySelectorAll('.tab').forEach(b=> b.onclick = ()=>{ D.tab=b.dataset.t; render(); });
  const sel = document.getElementById('exsel');
  if(sel) sel.onchange = ()=>{ D.ex = sel.value; try{ localStorage.setItem('prof_ex', D.ex); }catch(_){} render(); };
  document.getElementById('rf').onclick = async ()=>{ await loadAll(); render(); };
  document.getElementById('so').onclick = async ()=>{ await sb.auth.signOut(); location.href = location.pathname; };
  ({ sim:paneSim, gab:paneGab, res:paneRes, qst:paneQst, esc:paneEsc })[D.tab]();
}
const pane = () => document.getElementById('pane');
const flash = (html,cls='ok') => { const m = document.getElementById('fm'); if(m) m.innerHTML = `<div class="msg ${cls}">${html}</div>`; };
const countsOf = (id, sid) => { const s = D.subs.filter(x=>x.exam_id===id && x.school_id===sid); return { n:s.length, f:s.filter(x=>x.finished_at).length }; };
async function callFn(body){
  const { data:{ session } } = await sb.auth.getSession();
  const r = await fetch(SB_URL+'/functions/v1/school-admin', { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SB_KEY, Authorization:'Bearer '+session.access_token }, body:JSON.stringify(body) });
  const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'Erro'); return j;
}
const copyBtn = b => async ()=>{
  const i = b.parentElement.querySelector('input');
  try{ await navigator.clipboard.writeText(i.value); b.textContent='Copiado ✓'; }catch(_){ i.select(); b.textContent='Selecionado'; }
  setTimeout(()=> b.textContent='Copiar', 1800);
};

/* ---------- aba: provas (por escola) ---------- */
function paneSim(){
  const sc = schoolOf(D.sch);
  if(!sc){ pane().innerHTML = '<div class="card"><div class="msg info">Nenhuma escola cadastrada.</div></div>'; return; }
  const base = baseUrl()+'?escola='+encodeURIComponent(sc.slug);
  const rows = D.exams.map(e=>{
    const se = (D.se[sc.id]||{})[e.id] || { is_open:false, show_score:false };
    const st = countsOf(e.id, sc.id), nk = Object.keys(D.key[e.id]||{}).length;
    return `<tr data-id="${e.id}"><td><b>${lbl(e)}</b></td>
      <td><label class="sw ${se.is_open?'on':''}"><input type="checkbox" class="io" ${se.is_open?'checked':''}> <span>${se.is_open?'Aberta':'Fechada'}</span></label></td>
      <td><label class="sw ${se.show_score?'on':''}"><input type="checkbox" class="ss" ${se.show_score?'checked':''}> <span>${se.show_score?'Mostra nota':'Oculta nota'}</span></label></td>
      <td>${D.admin?`<input type="number" class="du" min="30" max="600" value="${e.duration_minutes}" style="width:84px">`:e.duration_minutes+' min'}</td>
      <td class="n">${nk}/${e.total}</td><td class="n">${st.n}</td><td class="n">${st.f}</td>
      <td><button class="btn xs sv">Salvar</button></td></tr>`;
  }).join('');
  pane().innerHTML = `<div class="card"><h2>Aplicação das provas</h2>
    ${D.admin?`<div class="row" style="margin-top:0">${schoolSel('ssel', sc.id)}</div>`:`<p><b>${esc(sc.name)}</b></p>`}
    <p class="muted small">O aluno só consegue começar uma prova que esteja <b>aberta para a sua escola</b>. Marque, ajuste e clique em <b>Salvar</b> na linha da prova.${D.admin?'':' A duração e o gabarito são definidos pelo administrador.'}</p>
    <div class="tw"><table><tr><th>Prova</th><th>Situação</th><th>Nota ao aluno</th><th>Duração</th><th class="n">Gabarito</th><th class="n">Iniciaram</th><th class="n">Finalizaram</th><th></th></tr>${rows}</table></div>
    <div id="fm"></div></div>
    <div class="card"><h2>Links para os alunos · ${esc(sc.name)}</h2>
      <p class="muted small">O link da escola já abre com a escola escolhida. Os links por prova levam direto à prova.</p>
      <div class="lk"><b>Da escola</b><input readonly value="${esc(base)}" onclick="this.select()"><button class="btn xs sec cp">Copiar</button></div>
      ${D.exams.map(e=>`<div class="lk"><b>${lbl(e)}</b><input readonly value="${esc(base+'&prova='+e.id)}" onclick="this.select()"><button class="btn xs sec cp">Copiar</button></div>`).join('')}
    </div>`;
  const ss = document.getElementById('ssel'); if(ss) ss.onchange = ()=>{ D.sch = ss.value; paneSim(); };
  document.querySelectorAll('.sw input').forEach(i=> i.onchange = ()=>{
    const lab = i.closest('.sw'); lab.classList.toggle('on', i.checked);
    lab.querySelector('span').textContent = i.classList.contains('io') ? (i.checked?'Aberta':'Fechada') : (i.checked?'Mostra nota':'Oculta nota');
  });
  document.querySelectorAll('.sv').forEach(b=> b.onclick = async ()=>{
    const tr = b.closest('tr'), id = tr.dataset.id;
    const upd = { school_id:sc.id, exam_id:id, is_open:tr.querySelector('.io').checked, show_score:tr.querySelector('.ss').checked };
    b.disabled = true;
    let { error } = await sb.from('school_exams').upsert(upd, { onConflict:'school_id,exam_id' });
    if(!error && D.admin){
      const d = Math.min(600, Math.max(30, +tr.querySelector('.du').value||240));
      ({ error } = await sb.from('exams').update({ duration_minutes:d }).eq('id', id));
      if(!error) exById(id).duration_minutes = d;
    }
    b.disabled = false;
    if(error){ flash('Erro ao salvar: '+esc(error.message),'err'); return; }
    (D.se[sc.id] ||= {})[id] = { is_open:upd.is_open, show_score:upd.show_score };
    flash(`${esc(lbl(exById(id)))}: configuração salva.`);
  });
  document.querySelectorAll('.cp').forEach(b=> b.onclick = copyBtn(b));
}

/* ---------- aba: gabarito (só o administrador altera) ---------- */
function paneGab(){
  const e = exById(D.ex), key = D.key[e.id]||{}, ro = !D.admin;
  const qs = D.qs.filter(q=>q.exam_id===e.id).sort((a,b)=>a.number-b.number);
  const items = qs.map(q=>`<div class="gi"><b>${q.number}</b>${['A','B','C','D'].map(L=>`<label><input type="radio" name="g${q.number}" value="${L}" ${key[q.number]===L?'checked':''} ${ro?'disabled':''}>${L}</label>`).join('')}</div>`).join('');
  pane().innerHTML = `<div class="card"><h2>Gabarito · ${esc(lbl(e))}</h2>
    <p class="muted small">O gabarito é o mesmo para todas as escolas e nunca é enviado ao navegador dos alunos; a correção acontece no servidor.${ro?' Aqui você só consulta: alterações são feitas pelo administrador.':' Ao salvar, as notas de quem já finalizou esta prova (em todas as escolas) são recalculadas.'}</p>
    ${ro?'':`<p><b>Colar de uma vez</b> <span class="muted small">(ex.: 1-C, 2-C… ou “01 A 02 B…” ou só as ${e.total} letras: CCCABD…)</span></p>
    <textarea id="pt" placeholder="Cole aqui o gabarito das ${e.total} questões"></textarea>
    <p><button class="btn sec" id="ap">Preencher a grade</button></p>`}
    <div class="gk">${items}</div>
    ${ro?'':'<div class="row"><button class="btn" id="sk">Salvar gabarito e recalcular notas</button></div>'}
    <div id="fm"></div></div>`;
  if(ro) return;
  document.getElementById('ap').onclick = ()=>{
    const t = document.getElementById('pt').value.toUpperCase();
    const map = {};
    const pairs = [...t.matchAll(/(\d{1,2})\s*[-–:.)=]?\s*([ABCD])\b/g)];
    if(pairs.length >= 10){ pairs.forEach(m=> map[+m[1]] = m[2]); }
    else { [...t.replace(/[^ABCD]/g,'')].forEach((L,i)=> map[i+1]=L); }
    let n = 0; Object.entries(map).forEach(([q,L])=>{ const r = document.querySelector(`input[name="g${q}"][value="${L}"]`); if(r){ r.checked = true; n++; } });
    flash(`${n} respostas colocadas na grade. Confira e clique em salvar.`, n===e.total?'ok':'info');
  };
  document.getElementById('sk').onclick = async ()=>{
    const k = {}; qs.forEach(q=>{ const r = document.querySelector(`input[name="g${q.number}"]:checked`); if(r) k[q.number] = r.value; });
    const n = Object.keys(k).length;
    if(n < e.total && !confirm(`Só ${n} de ${e.total} questões têm resposta. Questões sem resposta valerão zero. Salvar mesmo assim?`)) return;
    const b = document.getElementById('sk'); b.disabled = true;
    const r1 = await sb.rpc('set_answer_key', { p_exam:e.id, p_key:k });
    if(r1.error){ b.disabled=false; flash('Erro: '+esc(r1.error.message),'err'); return; }
    const r2 = await sb.rpc('recalc_scores', { p_exam:e.id });
    b.disabled = false;
    if(r2.error){ flash('Gabarito salvo, mas houve erro ao recalcular: '+esc(r2.error.message),'err'); return; }
    D.key[e.id] = k; flash(`Gabarito salvo (${n}/${e.total}). Notas recalculadas para ${r2.data} aluno(s) que já finalizaram.`);
    await loadAll();
  };
}

/* ---------- aba: resultados ---------- */
function paneRes(){
  pane().innerHTML = `<div class="card"><h2>Resultados</h2>
    <div class="row">
      ${D.admin?schoolSel('fs', D.fs, true):''}
      <label>Prova: <select id="fe"><option value="">Todas as provas</option>${D.exams.map(e=>`<option value="${e.id}" ${e.id===D.ex?'selected':''}>${lbl(e)}</option>`).join('')}</select></label>
      <label>Turma: <select id="ft"></select></label>
      <button class="btn sec" id="csv">Baixar planilha (CSV)</button></div>
    <div id="kp"></div><h2 style="margin-top:14px">Resumo por turma</h2><div class="tw" id="rt"></div>
    <h2 style="margin-top:14px">Alunos</h2><div class="tw" id="tb"></div><div id="fm"></div></div>`;
  const fe = document.getElementById('fe'), ft = document.getElementById('ft'), fs = document.getElementById('fs');
  const base = ()=> D.subs.filter(s=>(!fs||!fs.value||s.school_id===fs.value) && (!fe.value||s.exam_id===fe.value));
  const fillTurmas = ()=>{
    const cur = ft.value;
    const t = [...new Set(base().map(s=>s.class_name))].sort();
    ft.innerHTML = '<option value="">Todas</option>'+t.map(x=>`<option ${x===cur?'selected':''}>${esc(x)}</option>`).join('');
  };
  const rowsNow = ()=> base().filter(s=>!ft.value||s.class_name===ft.value);
  const draw = ()=>{
    const rows = rowsNow();
    const done = rows.filter(s=>s.finished_at && s.score!=null);
    const avg = done.length ? done.reduce((a,s)=>a+s.score,0)/done.length : null;
    const semGab = fe.value && !Object.keys(D.key[fe.value]||{}).length;
    document.getElementById('kp').innerHTML = `<div class="kpis">
      <div class="kpi"><b>${rows.length}</b>iniciaram</div>
      <div class="kpi"><b>${rows.filter(s=>s.finished_at).length}</b>finalizaram</div>
      <div class="kpi"><b>${avg==null?'—':avg.toFixed(1)}</b>média de acertos</div>
      <div class="kpi"><b>${done.length?Math.max(...done.map(s=>s.score)):'—'}</b>maior nota</div></div>
      ${semGab?'<div class="msg info">Esta prova ainda não tem gabarito cadastrado; as notas aparecem depois que o administrador cadastrar.</div>':''}`;
    const byT = {};
    rows.forEach(s=>{ const k = s.school_id+'|'+s.exam_id+'|'+s.class_name; const o = byT[k] ||= { sc:s.school_id, ex:s.exam_id, t:s.class_name, n:0, f:0, sum:0, tot:0 };
      o.n++; if(s.finished_at){ o.f++; if(s.score!=null){ o.sum+=s.score; o.tot++; } } });
    document.getElementById('rt').innerHTML = `<table><tr>${D.admin?'<th>Escola</th>':''}<th>Prova</th><th>Turma</th><th class="n">Iniciaram</th><th class="n">Finalizaram</th><th class="n">Média de acertos</th><th class="n">% médio</th></tr>
      ${Object.values(byT).sort((a,b)=>schoolName(a.sc).localeCompare(schoolName(b.sc))||exById(a.ex).sort-exById(b.ex).sort||a.t.localeCompare(b.t)).map(o=>{ const e = exById(o.ex), m = o.tot? o.sum/o.tot : null;
        return `<tr>${D.admin?`<td>${esc(schoolName(o.sc))}</td>`:''}<td>${esc(lbl(e))}</td><td>${esc(o.t)}</td><td class="n">${o.n}</td><td class="n">${o.f}</td><td class="n">${m==null?'—':m.toFixed(1)+'/'+e.total}</td><td class="n">${m==null?'—':Math.round(m/e.total*100)+'%'}</td></tr>`; }).join('') || `<tr><td colspan="7" class="muted">Nenhum aluno ainda.</td></tr>`}</table>`;
    document.getElementById('tb').innerHTML = `<table><tr>${D.admin?'<th>Escola</th>':''}<th>Aluno</th><th>Turma</th><th>Prova</th><th class="n">Acertos</th><th class="n">%</th><th>Início</th><th>Situação</th><th></th></tr>
      ${rows.slice().sort((a,b)=>schoolName(a.school_id).localeCompare(schoolName(b.school_id))||a.class_name.localeCompare(b.class_name)||a.student_name.localeCompare(b.student_name)).map(s=>`<tr>
        ${D.admin?`<td>${esc(schoolName(s.school_id))}</td>`:''}<td>${esc(s.student_name)}</td><td>${esc(s.class_name)}</td><td>${esc(lbl(exById(s.exam_id)))}</td>
        <td class="n">${s.score==null?'—':s.score+'/'+s.total}</td>
        <td class="n">${s.score==null||!s.total?'—':Math.round(s.score/s.total*100)+'%'}</td>
        <td>${fdate(s.started_at)}</td>
        <td>${s.finished_at?'✓ finalizou':'<span style="color:var(--warn)">em andamento</span>'}</td>
        <td><button class="btn xs red del" data-id="${s.id}" data-n="${esc(s.student_name)}">Excluir</button></td></tr>`).join('') || '<tr><td colspan="9" class="muted">Nenhum aluno ainda.</td></tr>'}</table>`;
    document.querySelectorAll('.del').forEach(b=> b.onclick = async ()=>{
      if(!confirm(`Excluir a tentativa de “${b.dataset.n}”? As respostas dela serão apagadas e isso não pode ser desfeito.`)) return;
      const { error } = await sb.from('submissions').delete().eq('id', b.dataset.id);
      if(error){ flash('Erro ao excluir: '+esc(error.message),'err'); return; }
      D.subs = D.subs.filter(s=>s.id!==b.dataset.id); fillTurmas(); draw();
    });
  };
  fe.onchange = ()=>{ ft.value=''; fillTurmas(); draw(); }; ft.onchange = draw;
  if(fs) fs.onchange = ()=>{ D.fs = fs.value; ft.value=''; fillTurmas(); draw(); };
  fillTurmas(); draw();
  document.getElementById('csv').onclick = ()=>{
    const line = a => a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';');
    const csv = '﻿'+[line(['Escola','Aluno','Turma','Prova','Acertos','Total','Início','Fim'])].concat(rowsNow().map(s=>line([schoolName(s.school_id),s.student_name,s.class_name,lbl(exById(s.exam_id)),s.score,s.total,s.started_at,s.finished_at]))).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download = 'resultados_simulado_saresp_2026.csv'; a.click();
  };
}

/* ---------- aba: por questão ---------- */
async function paneQst(){
  const e = exById(D.ex), key = D.key[e.id]||{};
  const qs = D.qs.filter(q=>q.exam_id===e.id).sort((a,b)=>a.number-b.number);
  const sidNow = ()=> D.admin ? (document.getElementById('fs').value||null) : null;
  pane().innerHTML = `<div class="card"><h2>Desempenho por questão · ${esc(lbl(e))}</h2>
    ${Object.keys(key).length?'':'<div class="msg info">Esta prova ainda não tem gabarito cadastrado, então o percentual de acerto não aparece.</div>'}
    <div class="row">${D.admin?schoolSel('fs', D.fs, true):''}<label>Turma: <select id="ft"></select></label></div>
    <div id="bl"></div><div class="tw" id="tb">Carregando…</div></div>`;
  const fs = document.getElementById('fs'), ft = document.getElementById('ft');
  const fillT = ()=>{
    const sid = fs ? fs.value : '';
    const t = [...new Set(D.subs.filter(s=>s.exam_id===e.id && (!sid||s.school_id===sid)).map(s=>s.class_name))].sort();
    ft.innerHTML = '<option value="">Todas</option>'+t.map(x=>`<option>${esc(x)}</option>`).join('');
  };
  const draw = async ()=>{
    const f = ft.value;
    const { data, error } = await sb.rpc('question_stats', { p_exam:e.id, p_class:f||null, p_school:sidNow() });
    if(error){ document.getElementById('tb').innerHTML = `<div class="msg err">Erro: ${esc(error.message)}</div>`; return; }
    const by = {}; data.forEach(r=> by[r.o_q] = r);
    const total = data.length ? data[0].o_students : 0;
    const subj = {};
    qs.forEach(q=>{ const r = by[q.number], s = subj[q.subject] ||= { hit:0, poss:0 }; s.hit += r?r.o_hits:0; s.poss += total; });
    document.getElementById('bl').innerHTML = `<div class="kpis">${Object.entries(subj).map(([n,x])=>`<div class="kpi"><b>${x.poss?Math.round(x.hit/x.poss*100)+'%':'—'}</b>${esc(n)}</div>`).join('')}</div>
      <p class="muted small">Base: ${total} aluno(s) que finalizaram${f?' na turma '+esc(f):''}. Questão em branco conta como erro.</p>`;
    const color = p => p>=70?'var(--ok)':p>=40?'#e6a100':'var(--bad)';
    document.getElementById('tb').innerHTML = `<table><tr><th>Q</th><th>Disciplina</th><th>Gabarito</th><th class="n">% acerto</th><th></th><th>A</th><th>B</th><th>C</th><th>D</th></tr>
      ${qs.map(q=>{ const r = by[q.number]||{o_a:0,o_b:0,o_c:0,o_d:0,o_hits:0}, p = total? Math.round(r.o_hits/total*100):0, g = key[q.number];
        const alt = {A:r.o_a,B:r.o_b,C:r.o_c,D:r.o_d};
        return `<tr><td><b>${q.number}</b></td><td>${esc(q.subject)}</td><td>${g||'—'}</td><td class="n">${p}%</td>
          <td><div class="bar"><i style="width:${p}%;background:${color(p)}"></i></div></td>
          ${['A','B','C','D'].map(L=>`<td style="${g===L?'font-weight:800;color:var(--ok)':''}">${alt[L]}</td>`).join('')}</tr>`; }).join('')}</table>`;
  };
  ft.onchange = draw;
  if(fs) fs.onchange = ()=>{ D.fs = fs.value; fillT(); draw(); };
  fillT(); draw();
}

/* ---------- aba: escolas (admin) / minha escola ---------- */
function paneEsc(){
  if(!D.admin){ return paneMinha(); }
  const rows = D.schools.map(sc=>{
    const n = distinctStudents(sc.id), over = n > sc.max_students, t = D.subs.filter(s=>s.school_id===sc.id).length;
    return `<tr data-id="${sc.id}"><td><b>${esc(sc.name)}</b></td><td>${esc(sc.login||'—')}</td>
      <td class="n" style="${over?'color:var(--bad);font-weight:800':''}">${n} / ${sc.max_students}${over?' ⚠':''}</td><td class="n">${t}</td>
      <td>${sc.active?'<span style="color:var(--ok)">ativa</span>':'<span class="muted">desativada</span>'}</td>
      <td><button class="btn xs sec tg">${sc.active?'Desativar':'Ativar'}</button> <button class="btn xs sec pw">Nova senha</button> <button class="btn xs sec lk2">Link</button></td></tr>`;
  }).join('');
  pane().innerHTML = `<div class="card"><h2>Escolas cadastradas (${D.schools.length})</h2>
    <p class="muted small">“Alunos” conta nomes diferentes que já fizeram alguma prova. O plano gratuito foi dimensionado para escolas de até 300 alunos; acima disso aparece o aviso ⚠.</p>
    <div class="tw"><table><tr><th>Escola</th><th>Login</th><th class="n">Alunos</th><th class="n">Tentativas</th><th>Situação</th><th></th></tr>${rows}</table></div><div id="fm"></div></div>
    <div class="card"><h2>Cadastro de novas escolas</h2>
      <p class="muted small">Cada escola se cadastra sozinha pela tela de login do painel (botão “Cadastrar minha escola”) e precisa deste <b>código de cadastro</b>. Passe o código só para quem você autorizou.</p>
      <div class="lk"><b>Código</b><input readonly id="ic" value="${esc(D.invite||'')}" onclick="this.select()"><button class="btn xs sec cp">Copiar</button><button class="btn xs sec" id="nc">Gerar novo código</button></div>
      <div class="lk"><b>Painel</b><input readonly value="${esc(baseUrl()+'professor.html')}" onclick="this.select()"><button class="btn xs sec cp">Copiar</button></div>
      <div id="fm2"></div></div>`;
  document.querySelectorAll('.cp').forEach(b=> b.onclick = copyBtn(b));
  document.getElementById('nc').onclick = async ()=>{
    if(!confirm('Gerar um novo código? O código antigo deixa de funcionar para novos cadastros (escolas já cadastradas não são afetadas).')) return;
    const h = ()=>Math.random().toString(16).slice(2,6).toUpperCase().padEnd(4,'0');
    const v = h()+'-'+h()+'-'+h();
    const { error } = await sb.from('app_config').upsert({ key:'invite_code', value:v });
    if(error){ document.getElementById('fm2').innerHTML = `<div class="msg err">Erro: ${esc(error.message)}</div>`; return; }
    D.invite = v; document.getElementById('ic').value = v; document.getElementById('fm2').innerHTML = '<div class="msg ok">Novo código gerado.</div>';
  };
  document.querySelectorAll('.tg').forEach(b=> b.onclick = async ()=>{
    const id = b.closest('tr').dataset.id, sc = schoolOf(id);
    const { error } = await sb.from('schools').update({ active:!sc.active }).eq('id', id);
    if(error){ flash('Erro: '+esc(error.message),'err'); return; }
    sc.active = !sc.active; paneEsc();
  });
  document.querySelectorAll('.pw').forEach(b=> b.onclick = async ()=>{
    const id = b.closest('tr').dataset.id, sc = schoolOf(id);
    const p = prompt(`Nova senha para o login “${sc.login}” (mínimo 8 caracteres):`); if(!p) return;
    try{ await callFn({ action:'reset_password', school_id:id, password:p }); flash('Senha alterada. Informe a nova senha à escola.'); }
    catch(e){ flash('Erro: '+esc(e.message),'err'); }
  });
  document.querySelectorAll('.lk2').forEach(b=> b.onclick = async ()=>{
    const sc = schoolOf(b.closest('tr').dataset.id), u = baseUrl()+'?escola='+sc.slug;
    try{ await navigator.clipboard.writeText(u); flash('Link dos alunos copiado: '+esc(u)); }catch(_){ prompt('Link dos alunos:', u); }
  });
}
function paneMinha(){
  const sc = D.schools[0];
  if(!sc){ pane().innerHTML = '<div class="card"><div class="msg err">Sua conta não está ligada a nenhuma escola. Fale com o administrador.</div></div>'; return; }
  const n = distinctStudents(sc.id), u = baseUrl()+'?escola='+sc.slug;
  pane().innerHTML = `<div class="card"><h2>${esc(sc.name)}</h2>
    <div class="kpis"><div class="kpi"><b>${n} / ${sc.max_students}</b>alunos que já fizeram prova</div><div class="kpi"><b>${D.subs.length}</b>tentativas</div></div>
    <p class="muted small">Login da escola: <b>${esc(sc.login||'—')}</b></p>
    <div class="lk"><b>Link alunos</b><input readonly value="${esc(u)}" onclick="this.select()"><button class="btn xs sec cp">Copiar</button></div></div>
    <div class="card"><h2>Trocar a senha da escola</h2>
      <p class="muted small">Todos os professores que usam o login da escola passarão a usar a nova senha.</p>
      <div class="row"><input type="password" id="np" placeholder="nova senha (mín. 8 caracteres)" style="min-width:260px"><button class="btn" id="sp">Trocar senha</button></div><div id="fm"></div></div>`;
  document.querySelectorAll('.cp').forEach(b=> b.onclick = copyBtn(b));
  document.getElementById('sp').onclick = async ()=>{
    const p = document.getElementById('np').value;
    if(p.length < 8){ flash('A senha precisa ter pelo menos 8 caracteres.','err'); return; }
    try{ await callFn({ action:'reset_password', school_id:sc.id, password:p }); document.getElementById('np').value=''; flash('Senha alterada.'); }
    catch(e){ flash('Erro: '+esc(e.message),'err'); }
  };
}

start();
</script>
